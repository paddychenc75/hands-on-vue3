# 持续集成：push 到 main 和所有 pull request 都会跑。
#   check：类型检查、内容校验、单元测试（npm run check），再构建站点（构建失败会红）。几十秒。
#   e2e：浏览器测试（装 Playwright chromium，浏览器有缓存），读 check 构建好的站点。
# 部署在 deploy.yml：main 上的 CI 全部通过后才会部署，直接用这里构建好的站点，不重复构建。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: course/.vitepress/dist
          include-hidden-files: true
          retention-days: 7

  e2e:
    needs: check
    runs-on: ubuntu-latest
    # 全量浏览器测试本机约 40 分钟以上(CI 的机器更慢,留足余量);卡死时 120 分钟后自动结束
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: course/.vitepress/dist
      - name: Playwright 版本
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: 安装 chromium（缓存未命中）
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: 安装系统依赖（缓存命中）
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: 浏览器测试
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: e2e.log
          retention-days: 7
