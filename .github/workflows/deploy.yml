# 部署到 GitHub Pages：只在 main 分支的 CI（check 和 e2e）全部通过之后运行，直接发布 CI 里构建好的站点，不重复构建。
# 使用前：仓库 Settings → Pages → Source 选 "GitHub Actions"。站点地址是 https://<用户>.github.io/hands-on-vue3/（base 见 course/.vitepress/config.mts）。
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 只部署 main 上 push 触发、并且 CI 成功的那次运行（pull request 的运行不会走到这里）
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
